# 내 안드로이드 앱 저장소의 .github/workflows/release.yml 로 복사해서 쓰는 템플릿.
# 태그(예: v1.2.0)를 푸시하면 APK를 빌드해서 Release에 "<패키지명>_<versionCode>.apk" 이름으로 올린다.
# 전제: 앱의 build.gradle 이 환경변수 KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 로
#       release 서명을 하도록 되어 있어야 한다 (스토어 앱의 app/build.gradle.kts 참고).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}   # 앱의 build.gradle 이 이 값을 versionCode 로 쓰게 할 것
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          APK=$(find . -path '*outputs/apk/release/*.apk' | head -n 1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$APK")
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          cp "$APK" "${PKG}_${CODE}.apk"
          echo "file=${PKG}_${CODE}.apk" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
